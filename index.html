<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Up - Seus Links</title>
    <link rel="icon" type="image/png" href="img/up.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Título principal -->
        <h1 class="main-title">MEUS LINKS</h1>
        
        <!-- Seção Treinamentos e Eventos -->
        <div class="section">
            <h2 class="section-title">Treinamentos e Eventos</h2>

            <a href="https://instituto-up-formulario.vercel.app/?source=bio" class="link-card" target="_blank">
                <div class="card-content">
                    <h3>Encontro Up Online</h3>
                    <p>Construindo Uma Vida Mais Leve</p>
                </div>
            </a>

            <a href="https://instituto-up.vercel.app" class="link-card" target="_blank">
                <div class="card-content">
                    <h3>UP Day Plus</h3>
                    <p>Você não prescisa, VOCÊ MERECE</p>
                </div>
            </a>

            <!-- As UTMs abaixo não são enfeite: o site da VozUP classifica a
                 visita em src/lib/trafficSource.ts, e `utm_content=link_in_bio`
                 é o que faz este clique ser lido como tráfego ORGÂNICO de bio.
                 Sem elas o lead chega sem origem; com uma UTM de mídia paga por
                 engano, ele seria creditado a um anúncio que não existiu. -->
            <a href="https://www.escolavozup.com/?utm_source=instagram&amp;utm_medium=social&amp;utm_content=link_in_bio" class="link-card" target="_blank">
                <div class="card-content">
                    <h3>Escola VozUP</h3>
                    <p>Curso de oratória no Tatuapé</p>
                </div>
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
